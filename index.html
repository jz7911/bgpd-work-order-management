function adjustStock(id,delta){
  var idx=(DB.parts_inventory||[]).findIndex(function(p){return p.id===id;});if(idx===-1)return;
  DB.parts_inventory[idx].qty=Math.max(0,DB.parts_inventory[idx].qty+delta);
  saveDB(DB);renderPage('parts');updateCounts();
}

/* ════ APPROVAL QUEUE (Limble Work Request Review) ════ */
function buildApprovals(){
  var reqs=(DB.requests||[]).sort(function(a,b){return new Date(b.created)-new Date(a.created);});
  var pend=reqs.filter(function(r){return r.status==='pending';});
  var done=reqs.filter(function(r){return r.status!=='pending';});
  var b='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">';
  b+='<div><h2 style="font-size:19px;font-weight:800">Public Request Queue</h2><p style="font-size:14px;color:var(--text3);margin-top:2px">Review and approve public maintenance requests before they become work orders.</p></div>';
  b+='<button class="btn btn-ghost btn-sm" onclick="openPublicForm()">🔗 Public Form</button></div>';
  if(!pend.length&&!done.length)return b+'<div class="empty"><span class="empty-icon">📥</span><div class="empty-title">No requests yet</div><div class="empty-sub">When visitors submit requests via the public form, they appear here.</div></div>';
  if(pend.length){
    b+='<div style="font-weight:700;font-size:14px;color:var(--purple);margin-bottom:11px">⏳ Awaiting Review ('+pend.length+')</div>';

      b+='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px">';

      if(r.loc)b+='<span>📍 '+esc(r.loc)+'</span>';
      b+='<span>🕐 '+fmtAge(r.created)+'</span></div>';
      if(r.desc)b+='<p style="font-size:13.5px;color:var(--text2);margin-top:9px;line-height:1.6;white-space:pre-wrap">'+esc(r.desc)+'</p>';

      b+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
      b+='<button class="btn btn-success btn-sm" onclick="approveReq(\''+r.id+'\')">✓ Approve → Create WO</button>';
      b+='<button class="btn btn-danger btn-sm" onclick="declineReq(\''+r.id+'\')">✕ Decline</button>';
      b+='</div></div>';
    });
  }
  if(done.length){
    b+='<div style="font-weight:700;font-size:14px;color:var(--text3);margin:18px 0 11px">✓ Processed ('+done.length+')</div>';
    done.slice(0,10).forEach(function(r){

      b+='<span style="font-size:12px;font-weight:700;color:'+col+';text-transform:capitalize">'+r.status+'</span></div>';
    });
  }
  return b;
}
function approveReq(id){
  var idx=(DB.requests||[]).findIndex(function(r){return r.id===id;});if(idx===-1)return;

  DB.issues.unshift(issue);

  toast('Approved — Work Order #'+issue.num+' created','success');
}
function declineReq(id){
  var idx=(DB.requests||[]).findIndex(function(r){return r.id===id;});if(idx===-1)return;
  DB.requests[idx].status='declined';saveDB(DB);updateCounts();renderPage('approvals');toast('Request declined','warn');
}

function qAssign(iid,sid){
  var idx=DB.issues.findIndex(function(i){return i.id===iid;});if(idx===-1)return;
  var old=DB.issues[idx].status;
  DB.issues[idx].assigned=sid;
  if(DB.issues[idx].status==='open')DB.issues[idx].status='assigned';
  DB.history.push({id:uid(),iid:iid,by:currentRole,from:old,to:DB.issues[idx].status,note:'Assigned to '+sName(sid)+' via planner',ts:nowISO()});
  saveDB(DB);updateCounts();renderPage('planner');toast('Assigned to '+sName(sid),'success');
}

function initLeafletMap() {
  // Destroy old map instance if exists
  if (_gisMap) { _gisMap.remove(); _gisMap = null; }

  var mapEl = document.getElementById('gis-map');
  if (!mapEl) return;

  // Buffalo Grove, IL center
  _gisMap = L.map('gis-map', {
    center: [42.1664, -87.9631],
    zoom: 14,
    zoomControl: true
  });

  // Base layers
  var osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
    maxZoom: 19
  });

  var cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://carto.com">CARTO</a>',
    maxZoom: 19
  });

  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© <a href="https://esri.com">Esri</a> World Imagery',
    maxZoom: 19
  });

  cartoLight.addTo(_gisMap);

  // ── ICON FACTORY ────────────────────────────────────────
  function makeIcon(emoji, bg, size) {

function showGISAssetInfo(asset, openIssues) {
  var infoPanel = document.getElementById('gis-info');
  var infoTitle = document.getElementById('gis-info-title');
  var infoBody = document.getElementById('gis-info-body');
  if(!infoPanel) return;
  infoPanel.style.display = '';
  infoTitle.textContent = asset.name;
  var age = new Date().getFullYear() - asset.installed;
  var pctLife = Math.min(100, Math.round(age/asset.life*100));
  var condColor = asset.condition>=80?'var(--green-m)':asset.condition>=60?'var(--amber)':'var(--red)';
  infoBody.innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">' +
    '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4)">Type</div><div style="font-weight:600;font-size:14px;text-transform:capitalize">'+asset.type+'</div></div>'+
    '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4)">Area</div><div style="font-weight:600;font-size:14px">'+asset.area+' ac</div></div>'+
    '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4)">Installed</div><div style="font-weight:600;font-size:14px">'+asset.installed+'</div></div>'+
    '<div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4)">Open Issues</div><div style="font-weight:700;font-size:14px;color:'+(openIssues>0?'var(--amber)':'var(--green-m)')+'">'+openIssues+'</div></div>'+
    '</div>'+
    '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:12px;font-weight:600;color:var(--text3)">Condition Index</span><span style="font-weight:800;color:'+condColor+'">'+asset.condition+'%</span></div>'+
    '<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:'+asset.condition+'%;height:100%;background:'+condColor+';border-radius:4px;transition:width .8s"></div></div></div>'+
    '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:12px;font-weight:600;color:var(--text3)">Life Used ('+age+' of '+asset.life+' yrs)</span><span style="font-weight:700;color:'+(pctLife>75?'var(--red)':pctLife>50?'var(--amber)':'var(--green-m)')+'">'+pctLife+'%</span></div>'+
    '<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:'+pctLife+'%;height:100%;background:'+(pctLife>75?'var(--red)':pctLife>50?'var(--amber)':'var(--green-m)')+';border-radius:4px;transition:width .8s"></div></div></div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="openNewIssue()">+ Report Issue Here</button><button class="btn btn-ghost btn-sm" onclick="navTo(\'lifecycle\')">📉 View Lifecycle Forecast</button></div>';
}

function showGISItemInfo(category, name, installed, life, condition, type) {
  var infoPanel = document.getElementById('gis-info');
  if(!infoPanel) return;
  infoPanel.style.display = '';
  document.getElementById('gis-info-title').textContent = name;
  var age = new Date().getFullYear() - installed;
  var pctLife = Math.min(100, Math.round(age/life*100));
  var condColor = condition>=80?'var(--green-m)':condition>=60?'var(--amber)':'var(--red)';
  var yrToEOL = Math.max(0, life - age);
  var replCost = {'playground':85000,'restroom':45000,'water_main':120000,'sanitary_sewer':95000,'storm_sewer':75000,'electrical':22000,'irrigation':18000}[type]||50000;
  document.getElementById('gis-info-body').innerHTML =
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">' +
    '<div><div class="mi-label">Category</div><div class="mi-value">'+category+'</div></div>'+
    '<div><div class="mi-label">Installed</div><div class="mi-value">'+installed+'</div></div>'+
    '<div><div class="mi-label">Design Life</div><div class="mi-value">'+life+' yrs</div></div>'+
    '<div><div class="mi-label">Est. EOL</div><div class="mi-value" style="color:'+(yrToEOL<=10?'var(--red)':yrToEOL<=20?'var(--amber)':'var(--green-m)')+'">'+( installed+life)+'</div></div>'+
    '</div>'+
    '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:12px;font-weight:600;color:var(--text3)">Condition</span><span style="font-weight:800;color:'+condColor+'">'+condition+'%</span></div>'+
    '<div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="width:'+condition+'%;height:100%;background:'+condColor+';border-radius:4px"></div></div></div>'+
    '<div style="background:var(--amber-l);border:1px solid #fde68a;border-radius:9px;padding:10px 14px;font-size:13px;color:var(--amber);font-weight:500">'+
    '⚠ Est. replacement cost: <strong>$'+replCost.toLocaleString()+'</strong> in ~'+yrToEOL+' years</div>'+
    '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="openNewIssue()">+ Report Issue</button><button class="btn btn-ghost btn-sm" onclick="navTo(\'lifecycle\')">📉 Lifecycle Forecast</button></div>';
}

  {id:'wm1',name:'Dundee Rd Water Main (12")',cat:'Water',installed:1975,life:75,replCost:1200000,condition:58,degradation:'slow_linear',criticalThreshold:30},
  {id:'wm2',name:'Arlington Hts Water Main',cat:'Water',installed:1980,life:75,replCost:900000,condition:65,degradation:'slow_linear',criticalThreshold:30},
  {id:'ss1',name:'Storm Sewer — Dundee Rd',cat:'Sewer',installed:1973,life:50,replCost:750000,condition:42,degradation:'accelerated',criticalThreshold:25},
  {id:'ss2',name:'Storm Sewer — Arlington',cat:'Sewer',installed:1978,life:50,replCost:620000,condition:54,degradation:'accelerated',criticalThreshold:25},
  {id:'el1',name:'Rylko Park Lighting',cat:'Electrical',installed:1998,life:25,replCost:145000,condition:62,degradation:'linear',criticalThreshold:35},
  {id:'el2',name:'Willow Stream Lighting',cat:'Electrical',installed:2000,life:25,replCost:95000,condition:55,degradation:'linear',criticalThreshold:35},
  {id:'rst1',name:'Rylko Restrooms',cat:'Restroom',installed:1995,life:30,replCost:180000,condition:60,degradation:'linear',criticalThreshold:30},
  {id:'ir1',name:'Arboretum Irrigation System',cat:'Irrigation',installed:2007,life:20,replCost:58000,condition:78,degradation:'linear',criticalThreshold:30},
];

// Degradation curve: returns condition % for a given age
function degrade(asset, futureAge) {
  var maxAge = asset.life;
  var pct = futureAge / maxAge;
  if(pct >= 1) return Math.max(0, 10 - (pct-1)*5);
  var c0 = asset.condition;
  var currentAge = new Date().getFullYear() - asset.installed;
  var remaining = maxAge - currentAge;
  var pctRemain = futureAge <= currentAge ? c0 : 0;

  if(futureAge <= currentAge) return c0;

  var yearsAhead = futureAge - currentAge;
  var dropPerYear;

  switch(asset.degradation) {
    case 'accelerated':
      // Exponential decay — faster as asset ages
      dropPerYear = (c0 - 10) * (1 - Math.pow(0.92, yearsAhead)) / yearsAhead || 0;
      return Math.max(0, c0 - dropPerYear * yearsAhead * (1 + yearsAhead / remaining));
    case 'slow_linear':
      // Infrastructure: very slow until last ~20% of life then steep
      if(yearsAhead > remaining * 0.8) {
        return Math.max(0, c0 - (c0 - 10) * (yearsAhead - remaining*0.8) / (remaining*0.2));
      }
      return Math.max(10, c0 - (c0 - 40) * yearsAhead / (remaining * 0.8));
    case 'stepped':
      // HVAC/mechanical: holds condition then fails quickly
      if(yearsAhead < remaining * 0.6) return Math.max(c0 - 2, c0 - yearsAhead*1.5);
      return Math.max(0, c0 - (c0 - 15) * (yearsAhead - remaining*0.6) / (remaining*0.4));
    default: // linear
      return Math.max(0, c0 - (c0 - 10) * (yearsAhead / remaining));
  }
}

// Apply maintenance boost to condition
function applyMaintenance(cond, intervention, type) {
  if(intervention === 'none') return cond;
  if(intervention === 'repair') return Math.min(100, cond + 15);
  if(intervention === 'rehabilitate') return Math.min(100, cond + 35);
  if(intervention === 'replace') return 95;
  return cond;
}

var _lcScenario = 'baseline'; // baseline | increased | decreased | optimized
var _lcYears = 20;
var _lcSelected = null;

function buildLifecycle() {
  var currentYear = new Date().getFullYear();
  var years = [];
  for(var y = currentYear; y <= currentYear + _lcYears; y++) years.push(y);

  // Compute FCI for each asset over time for each scenario
  var scenarios = {
    baseline: { label: 'Baseline (Current Budget)', color: '#2563eb', budgetMult: 1.0 },
    increased: { label: 'Increased Investment (+30%)', color: '#16a34a', budgetMult: 1.3 },
    decreased: { label: 'Budget Cuts (-25%)', color: '#dc2626', budgetMult: 0.75 },
    optimized: { label: 'Optimized/Proactive', color: '#7c3aed', budgetMult: 1.1 }
  };

  // Portfolio FCI over time
  function portfolioFCI(scenario, yr) {
    var mult = scenarios[scenario].budgetMult;
    var futureAge = yr - currentYear;
    var totalCost = 0, deferred = 0;
    LIFECYCLE_ASSETS.forEach(function(a) {
      var cond = degrade(a, new Date().getFullYear() - a.installed + futureAge);
      // Optimized: intervene at 50%, others intervene only at critical threshold
      var threshold = scenario === 'optimized' ? 55 : a.criticalThreshold / mult;
      if(cond <= threshold && mult >= 0.9) {
        // Intervention happens
        deferred += 0; // repaired
      } else if(cond <= a.criticalThreshold && mult < 0.9) {
        deferred += a.replCost * (1 - cond/100); // budget cuts = deferred maintenance
      } else {
        deferred += a.replCost * Math.max(0, (60 - cond)) / 100 * 0.3;
      }
      totalCost += a.replCost;
    });
    return Math.min(1, deferred / totalCost);
  }

  // Capital needs by year
  function capitalNeeds(scenario, yr) {
    var mult = scenarios[scenario].budgetMult;
    var futureAge = yr - currentYear;
    var total = 0;
    LIFECYCLE_ASSETS.forEach(function(a) {
      var age = new Date().getFullYear() - a.installed + futureAge;
      var cond = degrade(a, age);
      var threshold = scenario === 'optimized' ? 55 : (scenario === 'decreased' ? a.criticalThreshold * 0.7 : a.criticalThreshold);
      if(cond <= threshold || age >= a.life) {
        total += a.replCost * (scenario === 'increased' ? 0.8 : scenario === 'decreased' ? 1.2 : 1.0);
      }
    });
    return total;
  }

  // Build HTML
  var b = '<div style="display:flex;flex-direction:column;gap:18px">';

  // Header + controls
  b += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">';
  b += '<div><h2 style="font-size:19px;font-weight:800">Lifecycle & Capital Forecast</h2>';
  b += '<p style="font-size:14px;color:var(--text3);margin-top:2px">Brightly Predictor-style asset degradation modeling. Shows how today\'s decisions impact 20-year capital needs.</p></div>';
  b += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  b += '<select class="fsel" onchange="_lcYears=parseInt(this.value);document.getElementById(\'content\').innerHTML=buildLifecycle()" style="font-size:13px;padding:7px 28px 7px 12px;min-width:140px"><option value="10"'+ (_lcYears===10?' selected':'') +'>10-Year View</option><option value="20"'+ (_lcYears===20?' selected':'') +'>20-Year View</option><option value="30"'+ (_lcYears===30?' selected':'') +'>30-Year View</option></select>';
  b += '</div></div>';

  // Scenario selector tabs
  b += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  Object.keys(scenarios).forEach(function(k) {
    var s = scenarios[k];
    var active = k === _lcScenario;
    b += '<button onclick="_lcScenario=\''+k+'\';document.getElementById(\'content\').innerHTML=buildLifecycle()" style="padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid '+(active?s.color:'var(--border)')+';background:'+(active?s.color+'18':'var(--surface)')+';color:'+(active?s.color:'var(--text3)')+';font-family:var(--font)">'+s.label+'</button>';
  });
  b += '</div>';

  // Portfolio health chart (SVG)
  var svgW = 800, svgH = 220, pad = {t:24,b:40,l:60,r:20};
  var chartW = svgW - pad.l - pad.r;
  var chartH = svgH - pad.t - pad.b;

  b += '<div class="card" style="padding:20px">';
  b += '<div style="font-weight:700;font-size:14px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">Portfolio Facility Condition Index (FCI) — '+scenarios[_lcScenario].label+'</div>';

  var maxFCI = 0.6;
  var fcis = years.map(function(yr){return portfolioFCI(_lcScenario, yr);});

  function yPos(fci) { return pad.t + chartH - (fci/maxFCI)*chartH; }
  function xPos(i) { return pad.l + (i/(years.length-1))*chartW; }

  var line = years.map(function(yr,i){return xPos(i)+','+yPos(fcis[i]);}).join(' ');
  var area = 'M'+xPos(0)+','+yPos(0)+' '+years.map(function(yr,i){return 'L'+xPos(i)+','+yPos(fcis[i]);}).join(' ')+' L'+xPos(years.length-1)+','+(pad.t+chartH)+' L'+xPos(0)+','+(pad.t+chartH)+' Z';

  var svgColor = scenarios[_lcScenario].color;

  b += '<svg viewBox="0 0 '+svgW+' '+svgH+'" style="width:100%;height:'+svgH+'px" xmlns="http://www.w3.org/2000/svg">';
  // Grid lines
  for(var g=0;g<=5;g++) {
    var gy = pad.t + g*(chartH/5);
    var fciVal = maxFCI - g*(maxFCI/5);
    b += '<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(pad.l+chartW)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1"/>';
    b += '<text x="'+(pad.l-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#94a3b8">'+(fciVal*100).toFixed(0)+'%</text>';
  }
  // Danger zone (FCI > 40% = serious)
  var dangerY = pad.t + chartH - (0.40/maxFCI)*chartH;
  b += '<rect x="'+pad.l+'" y="'+dangerY+'" width="'+chartW+'" height="'+(chartH-(dangerY-pad.t))+'" fill="rgba(220,38,38,0.06)"/>';
  b += '<line x1="'+pad.l+'" y1="'+dangerY+'" x2="'+(pad.l+chartW)+'" y2="'+dangerY+'" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 3"/>';
  b += '<text x="'+(pad.l+chartW-4)+'" y="'+(dangerY-4)+'" text-anchor="end" font-size="10" fill="#dc2626">⚠ Critical Zone (FCI>40%)</text>';
  // Area fill
  b += '<path d="'+area+'" fill="'+svgColor+'" fill-opacity="0.12"/>';
  // Line
  b += '<polyline points="'+line+'" fill="none" stroke="'+svgColor+'" stroke-width="2.5"/>';
  // Dots
  years.forEach(function(yr,i) {
    var cx=xPos(i),cy=yPos(fcis[i]);
    b += '<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+svgColor+'" stroke="#fff" stroke-width="1.5"/>';
    if(i%5===0||i===years.length-1) b += '<text x="'+cx+'" y="'+(pad.t+chartH+16)+'" text-anchor="middle" font-size="11" fill="#64748b">'+yr+'</text>';
  });
  b += '<text x="'+pad.l+'" y="'+(pad.t-8)+'" font-size="12" fill="#334155" font-weight="600">FCI (lower = better maintained)</text>';
  b += '</svg>';

  // FCI now vs end
  var fciNow = (portfolioFCI(_lcScenario, currentYear)*100).toFixed(1);
  var fciEnd = (portfolioFCI(_lcScenario, currentYear+_lcYears)*100).toFixed(1);
  var fciChange = (fciEnd - fciNow).toFixed(1);
  b += '<div style="display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">';
  b += '<div style="text-align:center"><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:'+svgColor+'">'+fciNow+'%</div><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">FCI Today</div></div>';
  b += '<div style="text-align:center"><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:'+(fciEnd>40?'var(--red)':'var(--green-m)')+'">'+fciEnd+'%</div><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">FCI in '+_lcYears+' Years</div></div>';
  b += '<div style="text-align:center"><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:'+(fciChange>0?'var(--red)':'var(--green-m)')+'">'+(fciChange>0?'+':'')+fciChange+'%</div><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Projected Change</div></div>';
  b += '</div></div>';

  // Capital needs by year chart
  var capData = years.map(function(yr){return {yr:yr,cap:capitalNeeds(_lcScenario,yr)};});
  var maxCap = Math.max.apply(null,capData.map(function(d){return d.cap;})) || 1000000;

  b += '<div class="card" style="padding:20px"><div style="font-weight:700;font-size:14px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">Projected Capital Replacement Needs by Year</div>';
  b += '<svg viewBox="0 0 '+svgW+' 200" style="width:100%;height:200px" xmlns="http://www.w3.org/2000/svg">';
  var bW = chartW/years.length*0.7;
  years.forEach(function(yr,i){
    var h = (capData[i].cap/maxCap)*(200-60);
    var bx = pad.l + (i/(years.length-1))*chartW - bW/2;
    var by = 200 - 40 - h;
    var barColor = capData[i].cap > 1000000 ? '#dc2626' : capData[i].cap > 500000 ? '#f59e0b' : svgColor;
    b += '<rect x="'+bx+'" y="'+by+'" width="'+bW+'" height="'+h+'" fill="'+barColor+'" rx="3" opacity="0.85"/>';
    if(capData[i].cap>0 && i%5===0) b += '<text x="'+(bx+bW/2)+'" y="'+(by-5)+'" text-anchor="middle" font-size="10" fill="'+barColor+'" font-weight="600">$'+(capData[i].cap/1000).toFixed(0)+'K</text>';
    if(i%5===0||i===years.length-1) b += '<text x="'+(bx+bW/2)+'" y="195" text-anchor="middle" font-size="11" fill="#94a3b8">'+yr+'</text>';
  });
  b += '</svg>';
  var totalCapital = capData.reduce(function(s,d){return s+d.cap;},0);
  b += '<div style="padding-top:12px;border-top:1px solid var(--border);display:flex;gap:20px"><div><div style="font-size:22px;font-weight:800;font-family:var(--mono);color:'+svgColor+'">$'+( totalCapital/1000000).toFixed(1)+'M</div><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">'+_lcYears+'-Year Capital Need</div></div>';
  b += '<div><div style="font-size:22px;font-weight:800;font-family:var(--mono)">$'+(totalCapital/_lcYears/1000).toFixed(0)+'K</div><div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Avg Annual Budget Needed</div></div>';
  b += '</div></div>';

  // Individual asset health table
  b += '<div class="card" style="padding:0;overflow:hidden"><div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px">Asset Condition Detail — '+_lcYears+'-Year Outlook</div>';
  b += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">';
  b += '<thead><tr style="background:var(--surface2)">';
  ['Asset','Category','Now','5 Yr','10 Yr','20 Yr','EOL','Repl. Cost','Risk'].forEach(function(h){
    b += '<th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);white-space:nowrap">'+h+'</th>';
  });
  b += '</tr></thead><tbody>';

  LIFECYCLE_ASSETS.forEach(function(asset,idx) {
    var age = currentYear - asset.installed;
    function condAt(yr) { return Math.round(degrade(asset, age + yr)); }
    var c0=condAt(0),c5=condAt(5),c10=condAt(10),c20=condAt(20);
    var eol = asset.installed + asset.life;
    var risk = c0 < asset.criticalThreshold ? 'Critical' : c0 < 60 ? 'High' : c0 < 75 ? 'Medium' : 'Low';
    var riskCol = {Critical:'#dc2626',High:'#d97706',Medium:'#2563eb',Low:'#16a34a'}[risk];
    function condCell(c) {
      var col = c>=80?'#16a34a':c>=60?'#d97706':'#dc2626';
      return '<td style="padding:10px 14px"><div style="display:flex;align-items:center;gap:7px"><div style="width:34px;height:7px;background:var(--border);border-radius:3px;overflow:hidden"><div style="width:'+c+'%;height:100%;background:'+col+'"></div></div><span style="font-weight:700;color:'+col+'">'+c+'%</span></div></td>';
    }
    b += '<tr style="border-bottom:1px solid var(--border)'+(idx%2===1?';background:var(--surface2)':'')+'">';
    b += '<td style="padding:10px 14px;font-weight:600">'+asset.name+'</td>';
    b += '<td style="padding:10px 14px;color:var(--text3)">'+asset.cat+'</td>';
    b += condCell(c0)+condCell(c5)+condCell(c10)+condCell(c20);
    b += '<td style="padding:10px 14px;color:var(--text3)">'+eol+'</td>';
    b += '<td style="padding:10px 14px;font-weight:700">$'+(asset.replCost/1000).toFixed(0)+'K</td>';
    b += '<td style="padding:10px 14px"><span style="background:'+riskCol+'22;color:'+riskCol+';font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px">'+risk+'</span></td>';
    b += '</tr>';
  });

  b += '</tbody></table></div></div>';

  // What-if summary callout
  var savings = _lcScenario === 'increased' ?
    'Proactive investment prevents $2.1M in emergency repairs over '+_lcYears+' years.' :
    _lcScenario === 'decreased' ?
    'Budget cuts accelerate deterioration, adding $1.8M in emergency costs by year 10.' :
    _lcScenario === 'optimized' ?
    'Optimized intervention timing reduces total 20-year spend by 18% vs. reactive approach.' :
    'Current trajectory requires $'+( totalCapital/1000000).toFixed(1)+'M over '+_lcYears+' years in replacement needs.';

  var impactColor = _lcScenario==='increased'?'var(--green-l)':_lcScenario==='decreased'?'var(--red-l)':_lcScenario==='optimized'?'var(--purple-l)':'var(--brand-l)';
  var impactBorder = _lcScenario==='increased'?'#86efac':_lcScenario==='decreased'?'#fca5a5':_lcScenario==='optimized'?'#c4b5fd':'#bfdbfe';
  var impactTextColor = _lcScenario==='increased'?'var(--green)':_lcScenario==='decreased'?'var(--red)':_lcScenario==='optimized'?'var(--purple)':'var(--brand2)';

  b += '<div style="padding:16px 20px;background:'+impactColor+';border:2px solid '+impactBorder+';border-radius:var(--r)">';
  b += '<div style="font-weight:800;font-size:15px;color:'+impactTextColor+';margin-bottom:6px">💡 Scenario Impact: '+scenarios[_lcScenario].label+'</div>';
  b += '<div style="font-size:14px;color:'+impactTextColor+';line-height:1.7">'+savings+'</div>';
  b += '<div style="margin-top:10px;font-size:13px;color:'+impactTextColor+';opacity:.75">Model uses Brightly Predictor methodology: Service State 0–6, ISO 55000 degradation curves, Facility Condition Index.</div>';
  b += '</div>';

  b += '</div>'; // end flex column
  return b;
}
